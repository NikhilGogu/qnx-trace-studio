name: tracestudio check
description: Check real-time budgets and priority inversions in a QNX kernel trace (.kev) and write a JUnit report
branding:
  icon: clock
  color: blue
inputs:
  trace:
    description: Path to the .kev or .kev.gz trace, relative to the workspace
    required: true
  args:
    description: >-
      Options for tracestudio check, for example "--deadline hi@ts_psrv=5000 --no-inversions --client ts_pload/".
      Split into words as a shell would: quote a word that holds spaces ("--client 'ts pload/'"). Wildcards
      and $VARIABLES are passed on as written, never expanded.
    required: true
  junit:
    description: Where to write the JUnit XML report
    required: false
    default: tracestudio-junit.xml
  python-version:
    description: Python version to run trace-studio with (3.10 or newer)
    required: false
    default: "3.12"
outputs:
  junit:
    description: Path of the JUnit XML report
    value: ${{ inputs.junit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install trace-studio
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"
    - name: tracestudio check
      shell: bash
      env:
        TS_TRACE: ${{ inputs.trace }}
        TS_ARGS: ${{ inputs.args }}
        TS_JUNIT: ${{ inputs.junit }}
      run: |
        # Split TS_ARGS as a POSIX shell would (quotes group words) but without expanding wildcards or
        # variables; an unbalanced quote fails here, before check runs.
        python -c 'import os, shlex, sys; sys.stdout.write("".join(a + "\0" for a in shlex.split(os.environ["TS_ARGS"])))' \
          > "$RUNNER_TEMP/tracestudio-args"
        args=()
        while IFS= read -r -d '' a; do args+=("$a"); done < "$RUNNER_TEMP/tracestudio-args"
        tracestudio check "$TS_TRACE" "${args[@]}" --junit "$TS_JUNIT"
