name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      # The traceprinter comparison needs the QNX SDP host tools, which a hosted
      # runner does not have; those checks are skipped here and run on a machine
      # with the SDP (TS_REQUIRE_ALL=1).
      - name: Unit and regression tests on the checked-in QNX 8.0 captures
        run: python tests/test_tracestudio.py
      - name: The CI gate on a failing and a passing capture
        run: |
          if tracestudio check tests/data/run1/prio_fixed.kev.gz --deadline hi@ts_psrv=5000 --no-inversions --client ts_pload/; then
            echo "expected exit status 1 for prio_fixed"; exit 1
          fi
          tracestudio check tests/data/run1/prio_inherit.kev.gz --deadline hi@ts_psrv=5000 --no-inversions --client ts_pload/
      - name: The mutex owner chain from the quickstart
        run: tracestudio analyze tests/data/run4/mutex_chain_nopi.kev.gz --slowest 1 --client ts_mutex/hi

  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The action passes on prio_inherit
        uses: ./
        with:
          trace: tests/data/run1/prio_inherit.kev.gz
          args: --deadline hi@ts_psrv=5000 --no-inversions --client ts_pload/
          junit: pass.xml
      - name: The action fails on prio_fixed
        id: fixed
        uses: ./
        continue-on-error: true
        with:
          trace: tests/data/run1/prio_fixed.kev.gz
          args: --deadline hi@ts_psrv=5000 --no-inversions --client ts_pload/
          junit: fail.xml
      - name: Check both outcomes and reports
        env:
          OUTCOME: ${{ steps.fixed.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'failures="0"' pass.xml
          grep -q 'type="PriorityInversion"' fail.xml
